name: Profile graphics

# Redraws the images the profile README shows:
#   profile-3d-contrib/profile-*.svg  3D contribution graph    (yoshi389111/github-profile-3d-contrib)
#   metrics/commit-calendar-*.svg     isometric commit calendar (lowlighter/metrics)

on:
  schedule:
    - cron: "0 18 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [master, readme-redesign]
    paths: [".github/workflows/profile-graphics.yml", ".github/profile-3d-contrib.json"]

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # GitHub's own greens on a dark slab (and a light twin), instead of the stock themes
          SETTING_JSON: .github/profile-3d-contrib.json

      # The calendar is drawn twice so the README can pick one per theme.
      - name: Commit calendar, light
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: commit-calendar-light.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: none

      - name: Commit calendar, dark
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: commit-calendar-dark.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          output_action: none
          # metrics colours the days for a light page; these are GitHub's dark-theme greens
          extras_css: |
            svg { color: #9198a1 !important }
            h2, h3 { color: #4493f8 !important }
            path[fill="#ebedf0"] { fill: #21262d !important }
            path[fill="#9be9a8"] { fill: #0e4429 !important }
            path[fill="#40c463"] { fill: #006d32 !important }
            path[fill="#30a14e"] { fill: #26a641 !important }
            path[fill="#216e39"] { fill: #39d353 !important }

      - name: Commit
        run: |
          mkdir -p metrics
          if ls /metrics_renders/*.svg >/dev/null 2>&1; then
            sudo mv /metrics_renders/*.svg metrics/
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib metrics
          if ! git diff --cached --quiet; then
            git commit -m "Update profile graphics"
            git pull --rebase
            git push
          fi
