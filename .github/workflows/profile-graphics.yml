name: Profile graphics

# Redraws the two images the profile README shows, both seen from the
# camera angle set in tools/view.py:
#   profile-3d-contrib/profile-*.svg  3D contribution graph, drawn by
#                                     yoshi389111/github-profile-3d-contrib, then turned
#   assets/name-*.svg                 the name banner
#   assets/intro-*.svg                the terminal under it, full width and for phones

on:
  schedule:
    - cron: "0 18 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [master, readme-redesign]
    paths: [".github/workflows/profile-graphics.yml", ".github/profile-3d-contrib.json", "tools/**"]

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # GitHub's own greens on a dark slab (and a light twin), instead of the stock themes
          SETTING_JSON: .github/profile-3d-contrib.json

      # the generator only draws a 45 degree view from afar; this turns the calendar
      # to our angle, brings the camera closer and keeps it clear of the charts
      - name: Re-stage the graph
        run: python3 tools/turn_graph.py profile-3d-contrib/*.svg

      - name: Name banner and intro card
        run: |
          python3 tools/draw_name.py
          python3 tools/draw_intro.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets/name-dark.svg assets/name-light.svg assets/intro-wide.svg assets/intro-narrow.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile graphics"
            git pull --rebase
            git push
          fi
