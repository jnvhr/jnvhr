name: Profile graphics

# Redraws the images the profile README shows, in the colours set in
# tools/palette.py and seen from the camera angle set in tools/view.py:
#   profile-3d-contrib/profile-*.svg  3D contribution graph, drawn by
#                                     yoshi389111/github-profile-3d-contrib, then turned
#   assets/banner-*.svg               the name banner, one for each theme
#   assets/terminal-*.svg             the terminal under it, by width (-narrow is for phones) and theme
#
# The graph changes every day, so it lives on the output branch, replaced by a
# single commit each run; master only holds what people write. The banner and
# the terminal only change when tools/ does, and are committed with it.

on:
  schedule:
    - cron: "0 18 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/profile-graphics.yml", ".github/profile-3d-contrib.json", "tools/**"]

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # every colour comes from tools/palette.py; the graph reads its share from this file
      - name: Colours for the graph
        run: python3 tools/palette.py

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib.json

      # the generator only draws a 45 degree view from afar; this turns the calendar
      # to our angle, brings the camera closer and keeps it clear of the charts
      - name: Re-stage the graph
        run: python3 tools/turn_graph.py profile-3d-contrib/*.svg

      - name: Name banner and terminal
        run: python3 tools/draw_hero.py

      # fails if tools/ changed without its pictures being redrawn and committed
      - name: Banner and terminal are up to date
        run: git diff --exit-code --stat -- assets .github/profile-3d-contrib.json

      - name: Publish the graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan output
          git reset -q
          git add -f profile-3d-contrib
          git commit -q -m "Profile graph"
          git push -q -f origin output
