name: Profile graphics

# Redraws the 3D contribution graph the profile README shows
# (profile-3d-contrib/profile-dark.svg and profile-light.svg),
# using yoshi389111/github-profile-3d-contrib.

on:
  schedule:
    - cron: "0 18 * * *" # once a day
  workflow_dispatch:
  push:
    branches: [master, readme-redesign]
    paths: [".github/workflows/profile-graphics.yml", ".github/profile-3d-contrib.json"]

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # GitHub's own greens on a dark slab (and a light twin), instead of the stock themes
          SETTING_JSON: .github/profile-3d-contrib.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "Update profile graphics"
            git pull --rebase
            git push
          fi
